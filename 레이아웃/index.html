<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: #8cc97d;
        }
        .wrap{
            max-width: 800px;
            width: 100%;
            height: 800px;
            margin: 0 auto;
        }
        header{
            width: 100%;
            height: 100px;
            background: #055e11;
        }
        nav{
            width: 100%;
            height: 100px;
            background: #0d801c;
        }
        main{
            width: 100%;
            height: 500px;
            display: flex;
        }
        main aside{
            width: 300px;
            height: 100%;
            background: #0ca520;
            }
        main article{
            width: 500px;
            height: 100%;
            background: #359242;
        }
        footer{
            width: 100%;
            height: 100px;
            background: #055e11;
        }
        @media screen and (max-width: 800px) {
        main{
            height: auto;
            flex-direction: column;
        }
         main aside{
            width: 100%;
            height: 200px;
            background: #0ca520;
            }
        main article{
            width: 100%;
            height: 400px;
            background: #359242;
        }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header></header>
        <nav></nav>
        <main>
            <aside></aside>
            <article></article>
        </main>
        <footer></footer>
    </div>
</body>
</html>
