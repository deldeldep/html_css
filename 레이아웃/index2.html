<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            width: 100%;
            height: 150px;
            background: #33851a;
        }
        main{
            width: 100%;
            height: 800px;
            display: flex;
        }
        .section1{
            width: 20%;
            height: 100%;
            background: #53e028;
        }
        .section2{
            width: 30%;
            height: 100%;
            background: #84a57a;
        }
        .section3{
            width: 50%;
            height: 100%;
            background: #b9f3a5;
        }
        footer{
            width: 100%;
            height: 150px;
            background: #33851a;
        }
        @media screen and (max-width: 960px){
            main{
            height: auto;
            flex-wrap: wrap;
            }
            .section1{
                width: 40%;
                height: 700px;
                background: #53e028;
            }
            .section2{
                width: 60%;
                height: 700px;
                background: #84a57a;
            }
            .section3{
                width: 100%;
                height: 200px;
                background: #b9f3a5;
            }
        }
        @media screen and (max-width: 720px){
            .section1{
                width: 100%;
                height: 200px;
                background: #53e028;
            }
            .section2{
                width: 100%;
                height: 200px;
                background: #84a57a;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header></header>
        <main>
            <section class="section1"></section>
            <section class="section2"></section>
            <section class="section3"></section>
        </main>
        <footer></footer>
    </div>
</body>
</html>
