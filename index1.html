<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0;padding: 0;}
        .wrap{border: 3px solid #000;
            width:700px;
            margin: 10px auto;
            padding: 10px;
            text-align: center;
        }
        header{border: 3px solid #000;
            padding: 10px;
            margin: 10px;
        }
        nav{border: 3px solid #000;
            padding: 10px;
            margin: 10px;
        }
        .container{
            display: flex;
            justify-content: space-between;
        }
        main{border: 3px solid #000;
            padding: 10px;
            width: 70%;
            margin: 10px;
        }
        figure{border: 3px solid #000;
            padding: 10px;
        }
        figcaption{background: skyblue;
            padding: 10px;
        }
        aside{border: 3px solid #000;
            padding: 10px;
            width: 20%;
            margin: 10px;
            vertical-align: middle;
        }
        footer{border: 3px solid #000;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>sematic</h1>
        <header>header
            <nav>nav</nav>
        </header>
        <div class="container">
            <main>main
                <figure>
                    <figcaption>figure</figcaption>
                </figure>
            </main>
            <aside>aside</aside>
        </div>
        <footer>footer</footer>
    </div>
</body>
</html>
