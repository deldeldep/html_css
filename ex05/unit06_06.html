<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{background: #000;}
        .cnt{
            width: 100%;
            margin: 10px auto;
            display: grid;
            grid-template-columns: repeat(4. 1fr);
            grid-template-rows: repeat(3, 300px);
            gap: 10px;
            text-align: center;
        }
        .cnt>div{background: yellow;}
        .box1{
            grid-column: 1/3;
            grid-row: 1/3;
        }
        .box2{
            grid-column: 3/5;
            grid-row: 1/2;
        }
        .box3{
            grid-column: 3/4;
            grid-row: 2/4;
        }
        .box4{
            grid-column: 4/5;
            grid-row: 2/4;
        }
        .box5{
            grid-column: 1/3;
            grid-row: 3/4;
        }
        .box1>div{
            width: 300px;
            margin: 50px auto;
        }
        .box1>div>img{
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="cnt">
        <div class="box1">
            <div>
                <img src="https://cdn.pixabay.com/photo/2019/12/19/03/24/christmas-4705310_1280.jpg" alt="img1">
                <p>내용</p>
            </div>
        </div>
        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box4">4</div>
        <div class="box5">5</div>
    </div>
</body>
</html>
