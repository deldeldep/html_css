<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0;padding: 0; font-size: 13px;}
        body{
            border-top:15px solid #333;
        }
        h1{font-size:50px;
            letter-spacing:-3px;
            color:#C8C8C8;
            text-align:center;
            border-top: 40px solid orangered;
            padding-top: 20px;
        }
        fieldset{
            border: 5px solid #ddd;
            border-radius: 20px;
            width: 330px;
            padding: 50px;
            margin: 10px auto;
        }
        .login{display: flex;}
        .idpw span label{
            display: inline-block;
            width: 58px;
        }
    </style>
</head>
<body>
    <form>
        <h1>Member Login</h1>   
            <fieldset>           
                <div class="login">
                    <div class="idpw">
                        <span>
                            <label for="userid">아이디</label>
                            <input type="text" id="userid">
                        </span>
                        <span>
                            <label for="userpw">비밀번호</label>
                            <input type="password" id="userpw">
                        </span>
                    </div>
                    <input type="submit" value="로그인하기">
                </div>
                <div class="check">
                    <div class="checkBox1">
                        <input type="checkbox" id="idsave">
                        <label for="idsave">아이디저장</label>
                        <input type="checkbox" id="secure">
                        <label for="secure">보안접속</label>
                    </div>
                    <div class="checkBox2">
                        <input type="button" value="회원가입">
                        <input type="button" value="아이디/비밀번호 찾기">
                    </div>
                </div>
            </fieldset>
    </form>
</body>
</html>
