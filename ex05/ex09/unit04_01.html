			h1{
				text-align: center;
				font-style: italic;
				font-size: 3em;
				color: #fff;
				text-shadow: 0 0 10px #666;
			}
			#bookList{
				background: url(./images/book_bg.png) no-repeat;
				width: 498px;
				height: 246px;
				border: 5px solid #dbdbdb;
				border-radius: 30px;
				box-shadow: 0 0 10px #666;
				margin: 20px auto;
			}
			#bookList ul{
				list-style: none;
				display: flex;
				position: relative;
				top: 22px;
				left: 22px;
			}
			#bookList ul li{
				margin-right: 63px;
				position: relative;				
			}
			#bookList ul li:hover a span img{
				box-shadow: 0 0 50px #060;
			}
			#bookList ul li a span .hit{
				width: 40px;
				height: 40px;
				display: block;
				background: url(./images/ico_hot.png) no-repeat;		
				position: absolute;
				top: -12px;
				left: -15px;
			}

		</style>
	</head>

	<body>
		<h1>New Book</h1>
		<div id="bookList">
			<ul>
				<li>
					<a href="#">
						<span>
							<img src="images/book1.png" width="107" height="156" alt="book1" class="frame"/><span class="hit"></span>
						</span>
					</a>
				</li>
				<li><a href="#"><span><img src="images/book2.png" width="107" height="156" alt="book2" class="frame"/><span class="hit"></span></span></a></li>
				<li><a href="#"><span><img src="images/book3.png" width="107" height="156" alt="book3" /><span class="hit"></span></span></a></li>
			</ul>
		</div>
