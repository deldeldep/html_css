<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sticky 스크롤 내렸을 때 어떻게 동작하게 만드는 방법</title>
    <style>
        body{
            padding-bottom: 2000px;
        }
        .positionbox{
            height: 1500px;
        }
        .positionbox>div{
            width: 200px;
            height: 200px;
            text-align: center;
            line-height: 200px;
            background: red;
            display: inline-block;
        }
        .positionbox>.sticky{
            background: orange;
            position: sticky;
            top: 0;
        }
        .positionbox>.static{
            background: yellow;
            position: static;
            top: 0;
        }
        .positionbox>.fixed{
            background: green;
            position: fixed;
            top: 10px;
        }
        .positionbox>.relative{
            background: blue;
            position: relative;
        }
        .positionbox>.absolute{
            background: purple;
            position: absolute;
            top: 71px;
            left: 625px;
        }
    </style>
</head>
<body>
    <div class="positionbox">
        <h2>스크롤을 내려보세요</h2>
        <div class="sticky">sticky</div>
        <div class="static">static</div>
        <div class="fixed">fixed</div>
        <div class="relative">relative</div>
        <div class="absolute">absolute</div>
    </div>
</body>
</html>
